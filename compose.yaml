services:
  analyzer:
    build: .
    image: financial_analyzer:latest
    container_name: financial_analyzer_app
    # Run as the host user: otherwise the SQLite file in ./data ends up owned by
    # root and the CLI outside Docker can no longer write it.
    user: "${UID:-1000}:${GID:-1000}"
    # Mandatory for console interactivity (input fields)
    stdin_open: true
    tty: true
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY:-}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - FA_DESKTOP_NOTIFICATIONS=${FA_DESKTOP_NOTIFICATIONS:-false}
      - FA_COOLDOWN_HOURS=${FA_COOLDOWN_HOURS:-24}
      - FA_EARNINGS_WARNING_DAYS=${FA_EARNINGS_WARNING_DAYS:-7}
      - FA_BENCHMARK=${FA_BENCHMARK:-SPY}
      # host.docker.internal lets the container reach llama-server on the host
      - FA_LOCAL_AI_URL=${FA_LOCAL_AI_URL:-http://host.docker.internal:5001/v1}
      - FA_LOCAL_AI_MODEL=${FA_LOCAL_AI_MODEL:-}
      - FA_LOCAL_AI_MAX_TOKENS=${FA_LOCAL_AI_MAX_TOKENS:-2000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - ./data:/app/data

  # One-shot alert check, driven by the systemd timer on the host (see
  # scripts/setup-systemd.sh). --trigger labels the row it writes to
  # check_runs, so a scheduled run is distinguishable from a manual one.
  alerts:
    build: .
    image: financial_analyzer:latest
    profiles: ["cron"]
    user: "${UID:-1000}:${GID:-1000}"
    command: ["check-alerts", "--trigger", "timer"]
    environment:
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY:-}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - FA_DESKTOP_NOTIFICATIONS=false
      - FA_COOLDOWN_HOURS=${FA_COOLDOWN_HOURS:-24}
      - FA_BENCHMARK=${FA_BENCHMARK:-SPY}
    volumes:
      - ./data:/app/data

  # Postgres for running the suite against the engine the hosted mode uses.
  # Ephemeral on purpose: no volume, so every start is a clean database.
  #   docker compose --profile dev up -d postgres
  postgres:
    image: postgres:17-alpine
    profiles: ["dev"]
    environment:
      - POSTGRES_USER=fa
      - POSTGRES_PASSWORD=fa
      - POSTGRES_DB=fa_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fa -d fa_test"]
      interval: 2s
      timeout: 3s
      retries: 20
