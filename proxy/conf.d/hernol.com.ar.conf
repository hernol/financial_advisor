# hernol.com.ar → el dashboard.
#
# Plantilla para el resto: copiar, cambiar server_name, el directorio del
# certificado y el proxy_pass.

server {
    listen 80;
    server_name hernol.com.ar www.hernol.com.ar;

    # certbot renueva por webroot y escribe acá. Tiene que responder por HTTP
    # sin redirección, o la validación falla y con ella se cae el TLS del mail,
    # que usa el mismo certificado.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name hernol.com.ar www.hernol.com.ar;

    ssl_certificate     /etc/letsencrypt/live/hernol.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hernol.com.ar/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    # Digital Asset Links, para que el TWA abra sin barra de URL. Lo sirve
    # nginx y no la app: es una afirmacion sobre el dominio, tiene que
    # responder aunque el dashboard este caido, y editarlo no obliga a
    # reconstruir la imagen. El prefijo de acme-challenge es mas largo, asi que
    # sigue ganando esa location y la renovacion no se toca.
    location /.well-known/ { alias /etc/nginx/well-known/; }

    location / {
        proxy_pass http://dashboard:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Without this the app believes it is being served over plain HTTP.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
