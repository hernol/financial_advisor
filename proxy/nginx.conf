# Reverse proxy for every site on this host.
#
# One file per domain under conf.d/, so adding a second site is dropping in a
# file and reloading — nothing here needs to change.
worker_processes auto;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # The dashboard streams AI reports and bulk refreshes that take a while.
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;
    client_max_body_size 10m;

    log_format  main  '$remote_addr - $host "$request" $status $body_bytes_sent';
    access_log  /var/log/nginx/access.log main;
    error_log   /var/log/nginx/error.log warn;

    # Someone pointing their own domain at this IP, or a scanner hitting it by
    # address, must not land on somebody's portfolio. Anything whose Host does
    # not match a configured site gets the connection closed.
    server {
        listen 80 default_server;
        server_name _;
        # ACME still has to work for a name being set up before its site exists.
        location /.well-known/acme-challenge/ { root /var/www/html; }
        location / { return 444; }
    }

    # The same on TLS. Without a default here, a connection whose SNI matches
    # nothing falls through to the first site defined — so an unrelated domain
    # pointed at this IP would be served somebody's portfolio under a name the
    # certificate does not cover. A certificate is still needed to get far
    # enough into the handshake to say no.
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;
        ssl_certificate     /etc/letsencrypt/live/hernol.com.ar/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hernol.com.ar/privkey.pem;
        return 444;
    }

    include /etc/nginx/conf.d/*.conf;
}
